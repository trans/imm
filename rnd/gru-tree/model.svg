<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" width="1160" height="640" role="img" aria-label="The GRU-only tree: a character GRU steps at every character; level k, a GRU 132 wide, steps after every 2^k-th character, reading the state of the level below after its second step of each pair. Each character's prediction adds every level's latest state, projected and gated, to the character GRU's state before a linear output layer. After epoch 3 only levels 1 and 2 have open gates."><defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#18212b" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#0c7a72" d="M0,0 L10,5 L0,10 z"/></marker>
</defs><style>
text { font-family: -apple-system, "Segoe UI", "Source Sans 3", Helvetica, Arial, sans-serif; }
.ln { stroke: #18212b; stroke-width: 1.2; fill: none; }
.dash { stroke-dasharray: 5 4; stroke: #5a6573; }
.faint { stroke: #d3d9df; stroke-dasharray: 3 3; }
.bx { fill: #ffffff; stroke: #18212b; stroke-width: 1.2; }
.strong { stroke: #0c7a72; stroke-width: 2.2; }
.rd { stroke: #0c7a72; stroke-width: 1.6; fill: none; }
.dot { fill: #0c7a72; }
.bar { fill: #0c7a72; }
.bar.shut { fill: #9aa6b2; }
.lbl { fill: #18212b; font-size: 14px; font-weight: 600; }
.sub { fill: #5a6573; font-size: 12.5px; }
.acc { fill: #0c7a72; font-size: 13.5px; font-weight: 600; }
.acc-sub { fill: #0c7a72; font-size: 12.5px; }
.val { fill: #18212b; font-size: 13px; font-variant-numeric: tabular-nums; }
.shut-t { fill: #5a6573; }
.chr { fill: #18212b; font: 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.num { fill: #5a6573; font-size: 11px; }
.subs { font-size: 9px; }
